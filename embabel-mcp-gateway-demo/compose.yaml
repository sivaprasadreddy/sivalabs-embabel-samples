services:

  mcp-gateway:
    # mcp-gateway secures your MCP servers
    image: docker/mcp-gateway:latest
    use_api_socket: true
    ports:
      - "8811:8811"
    command:
      - --transport=sse
      # add any MCP servers you want to use
      #- --servers=context7,wikipedia-mcp
      - --servers=github-official
      - --tools=github-official:*
      #- --tools=wikipedia-mcp:*

  app:
    build:
      target: app
    ports:
      - "8080:8080"
    environment:
      - MCP_GATEWAY_URL=http://mcp-gateway:8811
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - mcp-gateway
    profiles:
      - in-docker